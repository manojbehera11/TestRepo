name: Convert Jira ID to Hyperlink

on:
  pull_request:
    types: [opened]

jobs:
  jira-link:
    runs-on: ubuntu-latest

    steps:
      - name: Extract Jira ID from PR body
        id: jira
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const match = body.match(/[A-Z][A-Z0-9]+-\d+/);

            if (!match) {
              core.setFailed('No Jira issue key found in PR description');
              return;
            }

            core.setOutput('jira_key', match[0]);

      - name: Add Jira hyperlink as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const jiraKey = '${{ steps.jira.outputs.jira_key }}';
            const jiraUrl = `${process.env.JIRA_BASE_URL}/browse/${jiraKey}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `🔗 **Jira Issue:** [${jiraKey}](${jiraUrl})`
            });
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}

name: Convert Jira ID to Hyperlink

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [opened]

jobs:
  jira-link:
    runs-on: ubuntu-latest

    steps:
      - name: Convert Jira ID to hyperlink
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';

            // Match Jira ID (e.g. KAN-123)
            const match = body.match(/\b[A-Z][A-Z0-9]+-\d+\b/);

            if (!match) {
              core.setFailed('No Jira ID found in PR description');
              return;
            }

            const jiraKey = match[0];
            const jiraUrl = `${process.env.JIRA_BASE_URL}/browse/${jiraKey}`;
            const jiraLink = `[${jiraKey}](${jiraUrl})`;

            // Replace plain Jira ID with hyperlink
            const updatedBody = body.replace(jiraKey, jiraLink);

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: updatedBody
            });
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}

name: Add PR link to Jira and PR body

on:
  pull_request:
    types: [opened, edited]

jobs:
  jira-link:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Extract Jira ID from PR body
      - name: Extract Jira ID
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            // Regex to match first Jira ID like PROJ-123
            const match = body.match(/[A-Z][A-Z0-9]+-\d+/);
            if (!match) {
              core.setFailed("No Jira issue key found in PR body");
              return;
            }
            return match[0];
          result-encoding: string

      # Step 2: Add PR link as comment in Jira
      - name: Add PR link comment to Jira
        uses: actions/github-script@v7
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        with:
          script: |
            const jiraKey = '${{ steps.extract.outputs.result }}';
            const prUrl = github.event.pull_request.html_url;
            const prTitle = github.event.pull_request.title;

            const response = await fetch(`${process.env.JIRA_BASE_URL}/rest/api/3/issue/${jiraKey}/comment`, {
              method: 'POST',
              headers: {
                'Authorization': 'Basic ' + Buffer.from(`${process.env.JIRA_EMAIL}:${process.env.JIRA_API_TOKEN}`).toString('base64'),
                'Accept': 'application/json',
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                body: `Pull Request created: [${prTitle}](${prUrl})`
              })
            });

            const data = await response.json();
            console.log('Jira comment response:', data);

      # Step 3: Add clickable Jira link in PR body
      - name: Add Jira link to PR body
        uses: actions/github-script@v7
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
        with:
          script: |
            const jiraKey = '${{ steps.extract.outputs.result }}';
            const jiraBase = process.env.JIRA_BASE_URL;
            const jiraUrl = `${jiraBase}/browse/${jiraKey}`;
            const prNumber = github.event.pull_request.number;
            const currentBody = github.event.pull_request.body || '';

            const markdownLink = `[Jira Issue ${jiraKey}](${jiraUrl})`;

            if (!currentBody.includes(markdownLink)) {
              const newBody = `${currentBody}\n\n${markdownLink}`;
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                body: newBody
              });
              console.log(`Added Jira link to PR body: ${markdownLink}`);
            } else {
              console.log('PR body already contains Jira link.');
            }

name: Convert Jira ID and Create PR Link in Jira

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [opened]

jobs:
  jira-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Extract Jira ID and update PR body
        id: jira
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';

            // Match Jira ID like KAN-123
            const match = body.match(/\b[A-Z][A-Z0-9]+-\d+\b/);

            if (!match) {
              core.setFailed('No Jira ID found in PR description');
              return;
            }

            const jiraKey = match[0];
            const jiraUrl = `${process.env.JIRA_BASE_URL}/browse/${jiraKey}`;
            const jiraLink = `[${jiraKey}](${jiraUrl})`;

            // Replace plain Jira ID with hyperlink
            const updatedBody = body.replace(jiraKey, jiraLink);

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: updatedBody
            });

            core.setOutput('jira_key', jiraKey);

      - name: Create PR link comment in Jira
        run: |
          JIRA_KEY=${{ steps.jira.outputs.jira_key }}
          PR_URL=${{ github.event.pull_request.html_url }}

          curl -X POST \
            -u "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.JIRA_BASE_URL }}/rest/api/3/issue/$JIRA_KEY/comment" \
            -d "{
              \"body\": {
                \"type\": \"doc\",
                \"version\": 1,
                \"content\": [
                  {
                    \"type\": \"paragraph\",
                    \"content\": [
                      {
                        \"type\": \"text\",
                        \"text\": \"Pull Request created: \"
                      },
                      {
                        \"type\": \"text\",
                        \"text\": \"$PR_URL\",
                        \"marks\": [
                          {
                            \"type\": \"link\",
                            \"attrs\": {
                              \"href\": \"$PR_URL\"
                            }
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            }"
